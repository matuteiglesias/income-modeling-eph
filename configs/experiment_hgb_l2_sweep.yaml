experiment:
  id: hgb_l2_sweep_v1
  random_seed: 42

runtime:
  mode: sweep
  sample_n: 200000
  allow_full_run: false
  enabled_models:
    - hist_gradient_boosting

feature_view:
  name: clean_geo
  drop_columns:
    - AGLO_rk
    - Reg_rk
    
data:
  processed_dataset: data/processed/modeling_dataset.parquet
  split_assignments: data/processed/split_assignments.csv

split:
  train_size: 0.70
  test_size: 0.20
  validation_size: 0.10
  strategy: random_individual
  random_state: 42

cv:
  folds: 3
  scoring: r2
  return_train_score: true

diagnostics:
  enabled: true
  profile: hgb_capacity_sweep
  standard:
    residual_summary: true
    prediction_distribution_summary: true
    error_by_income_decile: false
  hgb:
    enabled: true
    basic_cv_summaries: true
    top_configs: true
    overfit_gap_by_config: true
  sweeps:
    enabled: true
    sweep_type: hgb_single_param
    primary_param: l2_regularization
    group_param: null
  plots:
    hgb_cv_curve: true
    hgb_train_vs_cv: true
    hgb_overfit_gap: true
    hgb_fit_time: true

models:
  linear_regression:
    enabled: false
    grid: {}
  ridge:
    enabled: false
    grid: {}
  lasso:
    enabled: false
    grid: {}
  hist_gradient_boosting:
    enabled: true
    grid:
      reg__learning_rate: [0.05]
      reg__max_iter: [200]
      reg__max_leaf_nodes: [63]
      reg__min_samples_leaf: [100]
      reg__l2_regularization: [0.0, 0.001, 0.003, 0.01, 0.03, 0.1, 0.3, 1.0]
      reg__early_stopping: [false]
  mlp:
    enabled: false
    grid: {}

outputs:
  model_comparison: reports/tables/model_comparison_hgb_l2_sweep.csv
  experiment_card: reports/experiment_cards/hgb_l2_sweep.json
  runs_dir: reports/runs

observability:
  heartbeat_seconds: 10
  sklearn_verbose: 2
