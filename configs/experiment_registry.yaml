benchmark_policy_notes:
- 'Use ols_core as the clean OLS baseline for model-family comparisons: no pyramid, no geography, no temporal
  FE.'
- Use ols_core_aglo_plus_time_fe as the adjusted OLS specification for coefficient interpretation net
  of agglomerado/year/quarter fixed effects.
- Use household_pyramid only as an explicit sensitivity block, not as a default feature family.
- Do not treat geo_ranks as a main benchmark; they are leakage/sensitivity/placebo diagnostics.
