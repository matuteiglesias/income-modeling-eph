experiment:
  id: hgb_quick_shuffled_geo_ranks_v1
  kind: geography_leakage_probe
  random_seed: 42

runtime:
  mode: sweep
  sample_n: 5000
  enabled_models:
    - hist_gradient_boosting

feature_view:
  name: shuffled_geo_ranks
  permute_group_values:
    - column: AGLO_rk
      group_by: AGLOMERADO
      random_state: 42
    - column: Reg_rk
      group_by: Region
      random_state: 42

data:
  processed_dataset: data/processed/modeling_dataset.parquet
  split_assignments: data/processed/split_assignments.csv

split:
  train_size: 0.70
  test_size: 0.20
  validation_size: 0.10
  strategy: random_individual
  random_state: 42

cv:
  folds: 3
  scoring: r2
  return_train_score: true

artifacts:
  training_frame_sample_n: 10

diagnostics:
  enabled: true
  profile: geo_leakage_probe
  standard:
    residual_summary: true
    error_by_income_decile: true
    prediction_distribution_summary: true
    model_pairwise_error_comparison: false
    metric_gaps: false
  distribution:
    compression_summary: true
    decile_tail_summary: true
  comparison:
    family: geo_leakage_probe
    variant: shuffled_geo_ranks
    anchor_variant: clean_geo
  plots:
    observed_vs_predicted: true
    prediction_distribution: true
    mae_by_income_decile: true
    mean_residual_by_income_decile: true

models:
  linear_regression:
    enabled: false
    grid: {}

  ridge:
    enabled: false
    grid: {}

  lasso:
    enabled: false
    grid: {}

  hist_gradient_boosting:
    enabled: true
    grid:
      reg__loss: ["squared_error"]
      reg__learning_rate: [0.075]
      reg__max_iter: [200]
      reg__max_leaf_nodes: [31]
      reg__min_samples_leaf: [100]
      reg__l2_regularization: [0.0]
      reg__early_stopping: [false]
      reg__random_state: [42]

  mlp:
    enabled: false
    grid: {}

outputs:
  model_comparison: reports/tables/model_comparison_hgb_quick_shuffled_geo_ranks_v1.csv
  experiment_card: reports/experiment_cards/hgb_quick_shuffled_geo_ranks_v1.json
  runs_dir: reports/runs

observability:
  heartbeat_seconds: 10
  sklearn_verbose: 2
