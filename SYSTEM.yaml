# This file declares the repository boundary and its place in the GitHub estate.
schema_version: 1
id: research.eph.model
repository:
  id: repo.income-modeling-eph
  github: matuteiglesias/income-modeling-eph
domain: research
system: research.eph
role: income-modeling-research-workspace
lifecycle: active
authority:
  status: current
  owns:
  - EPH preprocessing after receipt of a versioned source release
  - annual preprocessed EPH artifact schema, lineage, manifests and releases
  - governed source-backed longitudinal EPH analysis frames and parent/monetary lineage
  - modeling dataset, income target, features, leakage exclusions and split policy
  - model training, experiment comparison, diagnostics and scientific evidence
  - promotion evidence and candidate EPH income-model bundles
  does_not_own:
  - official EPH source publication or raw archive acquisition and DBF conversion
  - semantic EPH-to-Census variable mapping authority
  - Census sample identity or Census geography authority
  - execution of promoted models over exact Census sample releases
  - poverty methodology or official poverty publication
interfaces:
  consumes:
  - artifact:publicdata.eph-microdata@1
  produces:
  - artifact:research.eph-annual-preprocessed@1
  - artifact:research.eph-longitudinal-analysis-frame/v1
  - artifact:research.eph-modeling-dataset@1
  - artifact:research.eph-income-model@1
  - artifact:research.eph-model-output@1
upstream:
- repo.microdatos-eph-indec
- repo.eph-censo-aligner (semantic deployment constraints when applicable)
downstream:
- repo.sampler-censo-arg (future promoted-model scoring consumer)
- repo.indice-pobreza-uba (prediction lineage consumer, not direct training runtime)
canonical_commands:
- make validate
- make test
- make preprocessing-smoke
- make preprocessing-release-fixture
- make longitudinal-fixture
- make preprocessing-manifests
- make build-dataset
generated_paths:
- artifacts/
- reports/
