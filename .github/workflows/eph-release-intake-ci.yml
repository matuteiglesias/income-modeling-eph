name: EPH release intake CI

on:
  pull_request:
    paths:
      - .github/workflows/eph-release-intake-ci.yml
      - .github/workflows/scheduled-eph-parent-discovery.yml
      - src/eph_income/eph_release_intake.py
      - scripts/14_eph_release_intake.py
      - tests/test_eph_release_intake.py
  push:
    branches:
      - main
    paths:
      - .github/workflows/eph-release-intake-ci.yml
      - .github/workflows/scheduled-eph-parent-discovery.yml
      - src/eph_income/eph_release_intake.py
      - scripts/14_eph_release_intake.py
      - tests/test_eph_release_intake.py

permissions:
  contents: read

jobs:
  intake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install bounded test tools
        run: python -m pip install pytest ruff

      - name: Lint intake boundary
        run: ruff check src/eph_income/eph_release_intake.py scripts/14_eph_release_intake.py tests/test_eph_release_intake.py

      - name: Verify intake boundary
        run: pytest -q tests/test_eph_release_intake.py
