name: Scheduled EPH maturity preflight

on:
  workflow_dispatch:
  schedule:
    - cron: "47 10 * * 2"

permissions:
  contents: read

concurrency:
  group: scheduled-eph-maturity-preflight
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'

      - name: Validate current annual artifacts
        run: make validate

      - name: Prove deterministic preprocessing fixture
        run: make preprocessing-release-fixture

      - name: Exercise mature model-release preflight
        run: make model-freeze-preflight

      - name: Summarize maturity result
        if: always()
        run: |
          {
            echo "## Scheduled EPH maturity preflight"
            echo
            echo "The scheduled path deliberately stops before expensive model fitting. It asks whether the current source/data/model boundary is mature enough to pass the existing flagship preflight."
            echo
            echo "A red run should be investigated as evidence (for example unresolved source-backed annual lineage, entity identity, monetary reference, or another explicit release gate); the scheduled workflow must not weaken the gate to become green."
            echo
            echo "Related architecture work: issues #24, #25, #26, #28 and #29."
          } >> "$GITHUB_STEP_SUMMARY"
